--muted);background:var(--white);border:1px dashed #cbbfae;border-radius:12px;grid-column:1/-1}.modal-backdrop{position:fixed;inset:0;background:#102b2882;display:grid;place-items:center;padding:20px;z-index:10}.modal{width:min(650px,100%);max-height:92vh;overflow:auto;background:var(--paper);border-radius:14px;padding:24px;box-shadow:0 20px 70px #102b2866}.modal h3{margin:0 0 17px;font-family:Georgia,"Songti SC",serif;font-size:24px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:14px;color:#314a43;font-weight:700}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--ink);background:var(--white)}.field textarea{min-height:96px;resize:vertical}.modal-footer{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:20px}.modal-footer .delete{margin-right:auto}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(440px,100%);background:var(--white);border:1px solid var(--line);padding:30px;box-shadow:0 12px 40px #102b1b12}.login-card h1{font-family:Georgia,"Songti SC",serif;font-size:30px;line-height:1.25;margin:8px 0 12px}.login-card p{color:var(--muted);margin:0}.login-card .btn{width:100%;margin-top:12px}.link-btn{border:0;background:transparent;color:var(--red);text-decoration:underline;display:block;margin:16px auto 0}.notice{font-size:14px;color:var(--red);margin-top:12px;white-space:pre-wrap}.sync{font-size:12px;color:var(--gold)}.signout{margin-top:12px}@media(max-width:820px){.app{grid-template-columns:1fr}aside{height:auto;position:static;padding:16px;border-right:0;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;padding:0 0 12px}.brand h1{font-size:19px}.brand p{display:block}.topic-list{grid-auto-flow:column;grid-auto-columns:max-content;overflow:auto;padding-bottom:3px}.topic{width:auto;white-space:nowrap}.side-tools{grid-template-columns:1fr 1fr;margin:12px 0 0}.side-note{display:none}ma   const defaults={topics:[['art-essence','艺术本质与特征','围绕艺术何以成为艺术、艺术与现实、精神、制度及形式的关系展开。'],['origin','艺术的起源','讨论艺术发生的原初动力及其与劳动、巫术、游戏、模仿的关系。'],['function','艺术功能','从审美认识、审美教育、审美娱乐及社会功能切入。'],['education','艺术教育','区分专业艺术教育与普通美育，讨论人格陶冶与审美能力培养。'],['creation','艺术创作','讨论创作主体、创作过程、灵感、体验与艺术生产。'],['work','艺术作品','围绕艺术语言、艺术形象、艺术意蕴及内容与形式关系展开。'],['reception','艺术接受','讨论鉴赏主体、期待视野、审美过程与批评。'],['sociology','艺术社会学','讨论艺术场域、文化资本、生产机制与大众文化。'],['film','电影理论','从电影语言、电影美学、媒介技术与观众机制切入。']],subtopics:[['mimesis','art-essence','模仿说','从自然、现实与理念的关系理解艺术再现；重点区分机械复制与选择、提炼后的艺术真实。'],['expression','art-essence','表现说与再现说','讨论艺术作为情感表现与现实再现的双重维度，以及二者如何在作品中统一。'],['game','art-essence','游戏说','从席勒、康德等思想中理解艺术与自由游戏、审美无功利性的关联。'],['objective','art-essence','客观精神说','艺术被理解为理念、绝对精神或民族精神的感性呈现。'],['institution','art-essence','艺术体制论','艺术的边界并非天然固定，而与艺术界、场域、制度承认及语境密切相关。'],['origin-theory','origin','劳动、巫术与游戏说','比较艺术起源的主要学说，并注意它们各自的解释力与局限。'],['aesthetic-function','function','审美认识、教育与娱乐','艺术功能具有复合性，应联系具体社会语境分析其实现方式。'],['aesthetic-education','education','美育与人格养成','从蔡元培、席勒等理论切入，讨论美育如何沟通感性与理性。'],['creative-process','creation','体验、构思与物化','以“胸中之竹—手中之竹”等命题梳理从生活体验到艺术形象的创造过程。'],['three-levels','work','艺术语言、形象与意蕴','艺术作品可由物质语言、感性形象与深层意蕴三个层级加以分析。'],['reception-aesthetics','reception','接受美学与期待视野','关注读者／观众如何以既有经验进入作品，并在空白与召唤中完成再创造。'],['field-distinction','sociology','艺术场域与区隔','从文化资本、趣味判断与自主性问题理解艺术的社会结构。'],['daily-life','sociology','日常生活审美化','讨论消费文化、媒介景观与审美经验向日常生活扩散的过程。'],['film-aesthetics','film','电影语言与电影美学','以镜头、剪辑、声音、时空和观看机制为基础，联系具体影片进行分析。']],cards:[['hegel','objective','黑格尔','《美学》','美是“理念的感性显现”。艺术通过感性形象使精神内容得以被把握。','《拉奥孔》、古希腊雕塑','可用于艺术本质、艺术与美、艺术疗愈等题目。'],['bourdieu-institution','institution','皮埃尔·布迪厄','艺术场域理论','艺术价值并非仅由作品内在属性决定，也由艺术场域、资本结构和承认机制共同建构。','马奈与19世纪巴黎艺术场域','可论述艺术体制、自律性、艺术与社会结构。'],['bourdieu-distinction','field-distinction','皮埃尔·布迪厄','《区隔》','被制度承认的“无功利审美”并非超越社会，而常与教育资本、阶级品味和区分实践相关。','博物馆文化、古典音乐品味','从审美判断切入艺术社会学，避免把趣味简单理解为个人偏好。'],['featherstone','daily-life','迈克·费瑟斯通','《消费文化与后现代主义》','消费文化推动日常生活审美化：商品、空间、身体与媒介共同成为可被设计和观看的审美对象。','城市商业空间、短视频视觉消费','可用于消费社会、生活中的美、媒介文化等论述。'],['jauss','reception-aesthetics','汉斯·罗伯特·姚斯','接受美学理论','作品意义在接受史中生成；“期待视野”既规定理解，也会在新作品冲击下被修正。','《红楼梦》的不同时代阐释','适合艺术接受、鉴赏再创造与经典重估。'],['ranciere','film-aesthetics','雅克·朗西埃','《电影的命运》','电影的政治性不只在主题表达，也在可见与可感的分配方式中；形式组织本身重构观看。','戈达尔电影、现实主义电影','可从电影形式进入影像政治与观众感知。']]};
  const initial=()=>({topics:defaults.topics.map((x,i)=>({id:x[0],title:x[1],description:x[2],sortOrder:i})),subtopics:defaults.subtopics.map((x,i)=>({id:x[0],topicId:x[1],title:x[2],overview:x[3],sortOrder:i})),cards:defaults.cards.map((x,i)=>({id:x[0],subtopicId:x[1],theorist:x[2],book:x[3],thesis:x[4],cases:x[5],framework:x[6],notes:'',reviewed:false,sortOrder:i}))});
  const clone=x=>JSON.parse(JSON.stringify(x)); const uid=p=>p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7); const esc=(v='')=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  let state=normalise(initial()),activeTopic='art-essence',activeSub=null,activeThird=null,user=null,channel=null,syncText='等待登录',draggingSubId=null,draggingCardId=null;
  function cache(){localStorage.setItem(KEY,JSON.stringify(state))} function status(text){syncText=text;const el=document.getElementById('syncStatus');if(el)el.textContent=text}
  function normalise(x){if(!(x&&Array.isArray(x.topics)&&Array.isArray(x.subtopics)&&Array.isArray(x.cards)))return initial();x.topics.forEach((item,i)=>item.sortOrder??=i);x.subtopics.forEach((item,i)=>item.sortOrder??=i);x.cards.forEach((item,i)=>item.sortOrder??=i);if(x.structureVersion!==2){const find=id=>x.subtopics.find(item=>item.id===id),add=(id,title,overview,parentId,sortOrder)=>{if(!find(id))x.subtopics.push({id,topicId:'art-essence',title,overview,parentId,sortOrder})};const hasEssence=x.topics.some(item=>item.id==='art-essence');if(hasEssence){add('subjective','主观精神说','从主体精神、审美无功利性、直觉与情感表现理解艺术本质。',null,1);add('mimesis-representation','模仿说与再现说','从现实、自然与艺术真实的关系讨论艺术再现并非机械复制。',null,2);add('form','形式论','从形式、结构、节奏与有意味的形式理解艺术特征。',null,3);add('representation','再现说','讨论艺术如何从现实出发，经由选择、提炼与重构呈现艺术真实。','mimesis-representation',1);const expression=find('expression'),game=find('game'),mimesis=find('mimesis');if(expression){expression.parentId='subjective';if(expression.title==='表现说与再现说')expression.title='表现说';expression.sortOrder=0}if(game){game.parentId='subjective';game.sortOrder=1}if(mimesis){mimesis.parentId='mimesis-representation';mimesis.sortOrder=0}['objective','subjective','mimesis-representation','form','institution'].forEach((id,i)=>{const item=find(id);if(item){item.parentId=null;item.sortOrder=i}})}x.structureVersion=2}return x}
  async function loadCloud(){if(!user)return;status('正在读取云端…');const {data,error}=await supabase.from('atlas_documents').select('content').eq('owner_id',user.id).maybeSingle();if(error){status('读取失败');alert(error.message);return}if(data){const version=data.content?.structureVersion;state=normalise(data.content);cache();if(version!==state.structureVersion)await sync()}else{const local=localStorage.getItem(KEY);try{state=normalise(local?JSON.parse(local):state)}catch{}state=normalise(state);const {error:writeError}=await supabase.from('atlas_documents').insert({owner_id:user.id,content:state});if(writeError){status('初始化失败');alert(writeError.message);return}}activeTopic=state.topics.some(x=>x.id===activeTopic)?activeTopic:state.topics[0]?.id;activeSub=null;activeThird=null;status('云端已同步');render()}
  async function sync(){cache();if(!user)return;status('正在同步…');const {error}=await supabase.from('atlas_documents').upsert({owner_id:user.id,content:state},{onConflict:'owner_id'});if(error){status('同步失败');alert(error.message);return}status('云端已同步')}
  const save=()=>void sync(); function topic(){return state.topics.find(t=>t.id===activeTopic)||state.topics[0]} function subs(){return state.subtopics.filter(s=>s.topicId===activeTopic&&!s.parentId).sort((a,b)=>a.sortOrder-b.sortOrder)} function thirds(){return state.subtopics.filter(s=>s.parentId===activeSub).sort((a,b)=>a.sortOrder-b.sortOrder)} function sub(){const list=subs();if(!list.some(s=>s.id===activeSub))activeSub=list[0]?.id;const parent=list.find(s=>s.id===activeSub),children=thirds();if(children.length){if(activeThird==='__parent__')return parent;if(!children.some(s=>s.id===activeThird))activeThird=children[0]?.id;return children.find(s=>s.id===activeThird)}activeThird=null;return parent} function cardsFor(id){return state.cards.filter(c=>c.subtopicId===id).sort((a,b)=>a.sortOrder-b.sortOrder)} function cards(){return cardsFor(activeThird&&activeThird!=='__parent__'?activeThird:activeSub)}
  function cardHTML(c){let out='<article draggable="true" title="按住卡片拖动可调整顺序" class="card" ondragstart="startCardDrag(event,\''+c.id+'\')" ondragover="dragOverCard(event)" ondragleave="leaveCardDrag(event)" ondrop="dropCard(event,\''+c.id+'\')" ondragend="endCardDrag()"><div class="card-top"><div><span class="tag">'+esc(c.theorist)+'</span><h4>'+esc(c.book)+'</h4></div><label class="check"><input type="checkbox" '+(c.reviewed?'checked':'')+' onchange="toggleReviewed(\''+c.id+'\',this.checked)"> 已复习</label></div><p class="thesis">'+esc(c.thesis)+'</p>';if(c.cases)out+='<p class="case"><strong>可用案例：</strong>'+esc(c.cases)+'</p>';if(c.framework)out+='<p class="case"><strong>答题切口：</strong>'+esc(c.framework)+'</p>';out+='<div class="card-actions"><button class="btn tiny" onclick="openForm(\'card\',\''+c.id+'\')">编辑卡片</button><button class="btn tiny" onclick="openCopyCard(\''+c.id+'\')">复制到…</button><button class="btn tiny danger" onclick="removeItem(\'card\',\''+c.id+'\')">删除</button></div></article>';return out}
  function render(){const t=topic();if(!t){document.getElementById('root').innerHTML='<div class="app"><aside><div class="brand"><div class="eyebrow">PERSONAL STUDY ATLAS</div><h1>Joiee 的北大 MFA 复习图谱</h1></div><button class="btn primary" onclick="openForm(\'topic\')">＋ 新增大题目</button></aside><main><div class="empty">请先新增一个大题目。</div></main></div>';return}const ss=subs(),s=sub();const topicsHTML=[...state.topics].sort((a,b)=>a.sortOrder-b.sortOrder).map(x=>'<button class="topic '+(x.id===activeTopic?'active':'')+'" onclick="selectTopic(\''+x.id+'\')">'+esc(x.title)+'</button>').join('');const subHTML=ss.map(x=>'<button draggable="true" title="按住拖动可调整顺序" class="sub '+(x.id===activeSub?'active':'')+'" ondragstart="startSubDrag(event,\''+x.id+'\')" ondragover="dragOverSub(event)" ondragleave="leaveSubDrag(event)" ondrop="dropSub(event,\''+x.id+'\')" ondragend="endSubDrag()" onclick="selectSub(\''+x.id+'\')">'+esc(x.title)+'<span class="grab">⋮⋮</span></button>').join('');let html='<div class="app"><aside><div class="brand"><div class="eyebrow">PERSONAL STUDY ATLAS</div><h1>Joiee 的北大 MFA 复习图谱</h1><p id="syncStatus">'+syncText+'</p><button class="btn ghost signout" onclick="signOut()">退出账号</button></div><div class="topic-list">'+topicsHTML+'</div><div class="side-tools"><button class="btn" onclick="openForm(\'topic\')">＋ 新增大题目</button><button class="btn" onclick="exportData()">导出资料</button><button class="btn" onclick="document.getElementById(\'importFile\').click()">导入资料</button><input id="importFile" class="hidden" type="file" accept="application/json,.json" onchange="importData(event)"></div><p class="side-note">你在手机或电脑保存的内容会实时同步。</p></aside><main><div class="topline"><div><div class="eyebrow">一级题目</div><h2>'+esc(t.title)+'</h2><p class="topic-desc">'+(esc(t.description)||'尚未填写题目说明。')+'</p></div><div class="actions"><button class="btn" onclick="openForm(\'topic\',\''+t.id+'\')">编辑大题目</button><button class="btn primary" onclick="openForm(\'subtopic\')">＋ 新增二级标题</button></div></div><p class="drag-hint">可拖动二级标题调整答题顺序，保存后会同步到所有设备。</p><div class="subnav">'+(subHTML||'<span class="empty">这个大题目还没有二级标题。</span>')+'</div>';if(!s){document.getElementById('root').innerHTML=html+'<div class="empty">请先新增一个二级标题，再建立理论与案例卡。</div></main></div>';return}html+='<section class="overview"><div><div class="eyebrow">二级理论与概述</div><h3>'+esc(s.title)+'</h3><p>'+esc(s.overview||'尚未填写概述。')+'</p></div><div class="actions"><button class="btn" onclick="openForm(\'subtopic\',\''+s.id+'\')">编辑概述</button><button class="btn danger" onclick="removeItem(\'subtopic\',\''+s.id+'\')">删除</button></div></section><div class="section-head"><div><h3>案例论述卡</h3><span>'+cards().length+' 张卡片 · 用于答题时调取理论与案例</span></div><button class="btn primary" onclick="openForm(\'card\')">＋ 新增案例卡</button></div><div class="cards">'+(cards().map(cardHTML).join('')||'<div class="empty">这里还没有案例卡。点击“新增案例卡”，把理论家、著作、论点和可论述案例放进来。</div>')+'</div></main></div>';document.getElementById('root').innerHTML=html}

  function field(label,name,value='',type='input',placeholder=''){const control=type==='textarea'?'<textarea name="'+name+'" placeholder="'+placeholder+'">'+esc(value)+'</textarea>':'<input name="'+name+'" value="'+esc(value)+'" placeholder="'+placeholder+'">';return '<div class="field"><label>'+label+'</label>'+control+'</div>'}
  function renderThirdNav(){if(activeTopic!=='art-essence')return;const anchor=document.querySelector('.subnav');if(!anchor)return;const list=thirds(),wrap=document.createElement('section');wrap.className='third-wrap';wrap.innerHTML='<div class="third-head"><span>三级标题（可选）</span><button class="btn tiny" onclick="openThirdForm()">＋ 新增三级标题</button></div>'+(list.length?'<div class="subnav third-nav"><button class="sub '+(activeThird==='__parent__'?'active':'')+'" onclick="selectThird(\'__parent__\')">二级总述</button>'+list.map(x=>'<button class="sub '+(x.id===activeThird?'active':'')+'" onclick="selectThird(\''+x.id+'\')">'+esc(x.title)+'</button>').join('')+'</div>':'<p class="third-note">当前二级标题可以直接放案例卡；需要细分时再新增三级标题。</p>');anchor.insertAdjacentElement('afterend',wrap)}
  function openThirdForm(id){if(!activeSub)return alert('请先选择一个二级标题。');const data=state.subtopics.find(x=>x.id===id),remove=data?'<button type="button" class="btn danger delete" onclick="removeThird(\''+data.id+'\');closeModal()">删除</button>':'';document.getElementById('modalRoot').innerHTML='<div class="modal-backdrop" onclick="closeModal(event)"><form class="modal" onclick="event.stopPropagation()" onsubmit="submitThirdForm(event,\''+(id||'')+'\')"><h3>'+(data?'编辑':'新增')+'三级标题</h3>'+field('三级标题名称','title',data?.title,'input','例如：表现说')+field('内容概述','overview',data?.overview,'textarea','写下核心问题、关键概念或答题入口。')+'<div class="modal-footer">'+remove+'<button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn primary">保存</button></div></form></div>'}
  function submitThirdForm(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(!f.title)return alert('请填写三级标题名称。');if(id)Object.assign(state.subtopics.find(x=>x.id===id),f);else{const node={id:uid('third'),topicId:activeTopic,parentId:activeSub,...f,sortOrder:thirds().length};state.subtopics.push(node);activeThird=node.id}save();closeModal();render()}

  function openCopyCard(id){const source=state.cards.find(x=>x.id===id);if(!source)return;const options=state.subtopics.map(node=>'<option value="'+esc(node.id)+'">'+esc(destinationLabel(node))+'</option>').join('');document.getElementById('modalRoot').innerHTML='<div class="modal-backdrop" onclick="closeModal(event)"><form class="modal" onclick="event.stopPropagation()" onsubmit="submitCopyCard(event,\''+id+'\')"><h3>复制案例卡</h3><p class="topic-desc">会创建一张可独立修改的新卡片，原卡不会被移动或改变。</p><div class="field"><label>复制到</label><select name="destination">'+options+'</select></div><div class="modal-footer"><button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn primary">复制</button></div></form></div>'}
  function submitCopyCard(e,id){e.preventDefault();const source=state.cards.find(x=>x.id===id),destination=new FormData(e.target).get('destination');if(!source||!destination)return;state.cards.push({...clone(source),id:uid('card'),subtopicId:destination,reviewed:false,sortOrder:cardsFor(destination).length});save();closeModal();render()}
  function openForm(kind,id){const data=kind==='topic'?state.topics.find(x=>x.id===id):kind==='subtopic'?state.subtopics.find(x=>x.id===id):state.cards.find(x=>x.id===id);let body='';if(kind==='topic')body=field('大题目名称','title',data?.title,'input','例如：艺术接受')+field('题目说明','description',data?.description,'textarea','这个板块重点讨论什么？');if(kind==='subtopic')body=field('二级标题','title',data?.title,'input','例如：接受美学与期待视野')+field('内容概述','overview',data?.overview,'textarea','写下核心问题、关键概念或答题入口。');if(kind==='card')body=field('理论家','theorist',data?.theorist,'input','例如：皮埃尔·布迪厄')+field('对应著作','book',data?.book,'input','例如：《区隔》')+field('核心论点','thesis',data?.thesis,'textarea','一句或两句概括理论命题。')+field('可用案例','cases',data?.cases,'textarea','作品、事件、现象均可。')+field('答题切口','framework',data?.framework,'textarea','适用于哪些题目、怎样展开。')+field('个人补充','notes',data?.notes,'textarea','你的课堂笔记、易错点或联想。');const suffix=kind==='topic'?'大题目':kind==='subtopic'?'二级标题':'案例卡';const remove=data?'<button type="button" class="btn danger delete" onclick="removeItem(\''+kind+'\',\''+data.id+'\');closeModal()">删除</button>':'';document.getElementById('modalRoot').innerHTML='<div class="modal-backdrop" onclick="closeModal(event)"><form class="modal" onclick="event.stopPropagation()" onsubmit="submitForm(event,\''+kind+'\',\''+(id||'')+'\')"><h3>'+(data?'编辑':'新增')+suffix+'</h3>'+body+'<div class="modal-footer">'+remove+'<button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn primary">保存</button></div></form></div>'}
  function closeModal(e){if(!e||e.target===e.currentTarget)document.getElementById('modalRoot').innerHTML=''} function submitForm(e,kind,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if((kind!=='card'&&!f.title)||(kind==='card'&&!f.book)){alert('请至少填写标题或著作名称。');return}if(kind==='topic'){if(id)Object.assign(state.topics.find(x=>x.id===id),f);else{const x={id:uid('topic'),...f,sortOrder:state.topics.length};state.topics.push(x);activeTopic=x.id;activeSub=null}}if(kind==='subtopic'){if(id)Object.assign(state.subtopics.find(x=>x.id===id),f);else{const x={id:uid('sub'),topicId:activeTopic,...f,sortOrder:subs().length};state.subtopics.push(x);activeSub=x.id}}if(kind==='card'){if(id)Object.assign(state.cards.find(x=>x.id===id),f);else{const container=activeThird&&activeThird!=='__parent__'?activeThird:activeSub;state.cards.push({id:uid('card'),subtopicId:container,...f,reviewed:false,sortOrder:cards().length})}}save();closeModal();render()}
  function selectTopic(id){activeTopic=id;activeSub=null;render()} function selectSub(id){activeSub=id;render()} function startSubDrag(e,id){draggingSubId=id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',id);e.currentTarget.classList.add('dragging')} function dragOverSub(e){e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.classList.add('drag-over')} function leaveSubDrag(e){e.currentTarget.classList.remove('drag-over')} function endSubDrag(){document.querySelectorAll('.sub').forEach(el=>el.classList.remove('dragging','drag-over'));draggingSubId=null} function dropSub(e,targetId){e.preventDefault();const sourceId=draggingSubId||e.dataTransfer.getData('text/plain');if(!sourceId||sourceId===targetId){endSubDrag();return}const list=subs(),from=list.findIndex(x=>x.id===sourceId),to=list.findIndex(x=>x.id===targetId);if(from<0||to<0){endSubDrag();return}const [moving]=list.splice(from,1);list.splice(to,0,moving);list.forEach((item,index)=>item.sortOrder=index);save();endSubDrag();render()} function startCardDrag(e,id){draggingCardId=id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',id);e.currentTarget.classList.add('dragging')} function dragOverCard(e){e.preventDefault();e.dataTransfer.dropEffect='move';e.currentTarget.classList.add('drag-over')} function leaveCardDrag(e){e.currentTarget.classList.remove('drag-over')} function endCardDrag(){document.querySelectorAll('.card').forEach(el=>el.classList.remove('dragging','drag-over'));draggingCardId=null} function dropCard(e,targetId){e.preventDefault();const sourceId=draggingCardId||e.dataTransfer.getData('text/plain');if(!sourceId||sourceId===targetId){endCardDrag();return}const list=cards(),from=list.findIndex(x=>x.id===sourceId),to=list.findIndex(x=>x.id===targetId);if(from<0||to<0){endCardDrag();return}const [moving]=list.splice(from,1);list.splice(to,0,moving);list.forEach((item,index)=>item.sortOrder=index);save();endCardDrag();render()} function removeItem(kind,id){const label=kind==='topic'?'大题目':kind==='subtopic'?'二级标题':'案例卡';if(!confirm(`确定删除这条${label}吗？`))return;if(kind==='card')state.cards=state.cards.filter(x=>x.id!==id);if(kind==='subtopic'){state.subtopics=state.subtopics.filter(x=>x.id!==id);state.cards=state.cards.filter(x=>x.subtopicId!==id);activeSub=null}if(kind==='topic'){const ids=state.subtopics.filter(x=>x.topicId===id).map(x=>x.id);state.topics=state.topics.filter(x=>x.id!==id);state.subtopics=state.subtopics.filter(x=>x.topicId!==id);state.cards=state.cards.filter(x=>!ids.includes(x.subtopicId));activeTopic=state.topics[0]?.id;activeSub=null}save();closeModal();render()} function toggleReviewed(id,v){state.cards.find(c=>c.id===id).reviewed=v;save()} function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Joiee-MFA复习图谱-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)} function importData(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=normalise(JSON.parse(r.result));if(confirm('导入会替换云端资料，是否继续。')){state=d;activeTopic=state.topics[0]?.id;activeSub=null;save();render()}}catch{alert('这不是可识别的图谱导出文件。')}};r.readAsText(file);e.target.value=''}
  function authView(message=''){document.getElementById('root').innerHTML='<div class="login"><section class="login-card"><div class="eyebrow">PRIVATE STUDY ATLAS</div><h1>Joiee 的北大 MFA 复习图谱</h1><p>使用同一个账号，手机和电脑会读取同一份资料。</p><div class="field"><label>邮箱</label><input id="email" type="email" placeholder="你的常用邮箱"></div><div class="field"><label>密码</label><input id="password" type="password" placeholder="至少 6 位"></div><button class="btn primary" onclick="login()">登录并同步</button><button class="link-btn" onclick="register()">第一次使用？注册账号</button><div class="notice">'+esc(message)+'</div></section></div>'}
async function login(){const email=document.getElementById('email').value,password=document.getElementById('password').value;if(!email||!password)return authView('请填写邮箱和密码。');const {error}=await supabase.auth.signInWithPassword({email,password});if(error)authView(error.message)} async function register(){const email=document.getElementById('email').value,password=document.getElementById('password').value;if(!email||!password)return authView('请先填写邮箱和密码，再点击注册。');const {data,error}=await supabase.auth.signUp({email,password,options:{emailRedirectTo:window.location.href}});authView(error?error.message:data.session?'注册成功，正在进入图谱。':'注册成功，请去邮箱确认后再登录。')} async function signOut(){await supabase.auth.signOut()} function start(session){user=session.user;try{state=normalise(JSON.parse(localStorage.getItem(KEY)))}catch{state=initial()}loadCloud();if(channel)supabase.removeChannel(channel);channel=supabase.channel('atlas-'+user.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'atlas_documents',filter:'owner_id=eq.'+user.id},payload=>{state=normalise(payload.new.content);cache();render();status('云端已同步')}).subscribe()}
  removeItem=function(kind,id){const label=kind==='topic'?'大题目':kind==='subtopic'?'二级标题':'案例卡';if(!confirm(`确定删除这条${label}吗？`))return;if(kind==='card')state.cards=state.cards.filter(x=>x.id!==id);if(kind==='subtopic'){const ids=state.subtopics.filter(x=>x.id===id||x.parentId===id).map(x=>x.id);state.subtopics=state.subtopics.filter(x=>!ids.includes(x.id));state.cards=state.cards.filter(x=>!ids.includes(x.subtopicId));activeSub=null;activeThird=null}if(kind==='topic'){const ids=state.subtopics.filter(x=>x.topicId===id).map(x=>x.id);state.topics=state.topics.filter(x=>x.id!==id);state.subtopics=state.subtopics.filter(x=>!ids.includes(x.id));state.cards=state.cards.filter(x=>!ids.includes(x.subtopicId));activeTopic=state.topics[0]?.id;activeSub=null;activeThird=null}save();closeModal();render()}
  Object.assign(window,{openForm,closeModal,submitForm,selectTopic,selectSub,selectThird,openThirdForm,submitThirdForm,removeThird,openCopyCard,submitCopyCard,startSubDrag,dragOverSub,leaveSubDrag,endSubDrag,dropSub,startCardDrag,dragOverCard,leaveCardDrag,endCardDrag,dropCard,removeItem,toggleReviewed,exportData,importData,login,register,signOut});
